name: Build experimental MeshCore USB app
on:
  workflow_dispatch:
  pull_request:
    paths:
      - tools/prepare_meshcore_usb.py
      - firmware/**
      - .github/workflows/meshcore-usb-lab.yml
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install --require-hashes -r dualboot_lab/requirements-bootstrap.lock
      - run: python -m pip install --require-hashes --no-build-isolation -r dualboot_lab/requirements-dev.lock
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          repository: meshcore-dev/MeshCore
          ref: 81dbae592ffad40b4212bc0b37e82b38da08f4bc
          path: firmware-work/MeshCore
      - run: python tools/prepare_meshcore_usb.py firmware-work/MeshCore --build
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: meshcore-usb-lab-experimental
          path: firmware-work/output/
