name: Dualboot lab checks
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  software:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r dualboot_lab/requirements.txt pytest==8.4.2
      - run: python -m pytest -q
      - run: python -m compileall -q dualboot_lab/lab tools
  container:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        platform: [linux/amd64, linux/arm64]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: dualboot_lab
          platforms: ${{ matrix.platform }}
          push: false
